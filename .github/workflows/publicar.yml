name: Publicar no Apps Script
on:
  push:
    branches: [main]
    paths: ['apps-script/**', '.github/workflows/publicar.yml']
  workflow_dispatch:
concurrency: publicar
env:
  SCRIPT_ID: 1l-Qv1Lr4UPHrM3IuugC1OHWP7gySRFVi2mwkPvmu-tCKWPs3IQpqAtiA
  DEPLOY_ID: AKfycby4kmFeeldrcw8QM8D0zHGQ9DAKox6oHoOq2L0Oj06CNjraBqtjoQ5AuXKfO5flFQBsRA
jobs:
  verificar:
    uses: ./.github/workflows/verificar.yml
  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar o clasp
        run: npm install -g @google/clasp@2.4.2
      - name: Credenciais do Google
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC" ]; then echo "Falta o segredo CLASPRC_JSON no repositório"; exit 1; fi
          printf '%s' "$CLASPRC" > ~/.clasprc.json
      - name: Manter o manifesto atual (fuso, acesso do app)
        run: |
          mkdir -p /tmp/remoto && cd /tmp/remoto
          printf '{"scriptId":"%s"}' "$SCRIPT_ID" > .clasp.json
          clasp pull
          cp appsscript.json "$GITHUB_WORKSPACE/apps-script/appsscript.json"
      - name: Declarar as permissões (planilha e acesso à internet para a IA)
        run: |
          node -e '
            const f=process.argv[1], fs=require("fs"), m=JSON.parse(fs.readFileSync(f,"utf8"));
            const need=["https://www.googleapis.com/auth/spreadsheets.currentonly","https://www.googleapis.com/auth/script.external_request"];
            m.oauthScopes=[...new Set([...(m.oauthScopes||[]),...need])];
            m.webapp=m.webapp||{executeAs:"USER_DEPLOYING",access:"ANYONE_ANONYMOUS"};
            fs.writeFileSync(f,JSON.stringify(m,null,2)); console.log(JSON.stringify(m));
          ' "$GITHUB_WORKSPACE/apps-script/appsscript.json"
      - name: Enviar o código
        run: |
          printf '{"scriptId":"%s","rootDir":"apps-script"}' "$SCRIPT_ID" > .clasp.json
          clasp push --force
      - name: Publicar nova versão no mesmo link
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: clasp deploy -i "$DEPLOY_ID" -d "$(printf '%s' "${MSG:-Atualização}" | head -c 90)"

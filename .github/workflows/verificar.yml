name: Verificar aplicativo
on:
  pull_request:
  workflow_call:   # chamado por pages.yml e publicar.yml antes de publicar
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: python fonte/build.py
      - name: Fontes e arquivos publicados correspondem
        run: git diff --exit-code -- index.html sw.js sync.js auth.js manifest.webmanifest apps-script/ProfileCore.gs assets
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

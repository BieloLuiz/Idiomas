<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
:root{--fundo:#F6F4EF;--tinta:#1F2937;--suave:#59667C;--marca:#5366C7;--marca-suave:#E6E9FA;--ouro:#F3C26C;--erro:#B84651;--certo:#2F8F5B}
*{box-sizing:border-box}html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:var(--fundo);font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--tinta)}
.topo{position:absolute;top:56px;left:56px;right:56px;display:flex;align-items:center;gap:14px}
.selo{background:var(--marca);color:#fff;font-weight:800;font-size:22px;letter-spacing:.06em;padding:8px 16px;border-radius:999px}
.titulo{font-size:26px;font-weight:700;color:var(--suave);line-height:1.2}
.eco{position:absolute;top:150px;left:50%;width:300px;margin-left:-150px}
.tela{position:absolute;top:520px;left:56px;right:56px;display:flex;flex-direction:column;gap:18px}
.linha{font-size:44px;font-weight:800;line-height:1.18;letter-spacing:-.01em;opacity:0;transform:translateY(24px);transition:opacity .45s ease,transform .45s cubic-bezier(.3,.7,.3,1)}
.linha.on{opacity:1;transform:none}
.linha.alvo{color:var(--marca)}
.linha.pt{font-size:34px;font-weight:600;color:var(--suave)}
.linha.errado{color:var(--erro);text-decoration:line-through;text-decoration-thickness:4px}
.linha.certo{color:var(--certo)}
.legenda{position:absolute;left:40px;right:40px;bottom:70px;min-height:150px;background:#fff;border-radius:28px;padding:24px 30px;box-shadow:0 10px 30px rgba(31,41,55,.08);font-size:30px;line-height:1.35;opacity:0;transition:opacity .25s}
.legenda.on{opacity:1}
.legenda small{display:block;font-size:20px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--suave);margin-bottom:6px}
.legenda.alvo{border:3px solid var(--marca)}.legenda.alvo p{color:var(--marca);font-weight:800}
.legenda p{margin:0}
.pausa{position:absolute;top:470px;right:56px;width:70px;height:70px;border-radius:50%;border:6px solid var(--marca-suave);border-top-color:var(--marca);opacity:0;animation:gira 1s linear infinite}
.pausa.on{opacity:1}@keyframes gira{to{transform:rotate(360deg)}}
.marca{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:20px;font-weight:700;color:#A0A8B8;letter-spacing:.04em}
</style></head><body>
<div class="topo"><span class="selo" id="selo"></span><span class="titulo" id="titulo"></span></div>
<div class="eco" id="eco"></div>
<div class="pausa" id="pausa"></div>
<div class="tela" id="tela"></div>
<div class="legenda" id="legenda"><small id="quem"></small><p id="fala"></p></div>
<div class="marca">idiomas · seu tempo, seu ritmo</div>
<script>
/* recebe window.AULA = { titulo, idioma, nivel, cenas:[{ini, fim, eco, tela:[...], falas:[{ini,fim,voz,texto,alvo}], pausa:[ini,fim]}] } e toca em tempo real */
window.tocarAula = function (A) {
  document.getElementById('selo').textContent = (A.idioma === 'fr' ? 'FRANCÊS' : 'INGLÊS') + ' ' + A.nivel;
  document.getElementById('titulo').textContent = A.titulo;
  var eco = Eco.criar(document.getElementById('eco'), { estilo: '2.5d', justo: true, estado: 'neutral', semToque: true });
  var tela = document.getElementById('tela'), leg = document.getElementById('legenda'), t0 = performance.now();
  function em(s, fn) { setTimeout(fn, Math.max(0, s * 1000 - (performance.now() - t0))); }
  function tipo(texto, i, cena) {
    if (/^✗/.test(texto)) return 'errado'; if (/^✓/.test(texto)) return 'certo';
    var falaAlvo = cena.falas.some(function (f) { return f.alvo && texto.indexOf(f.texto.replace(/[.!?]$/, '')) >= 0; });
    if (falaAlvo || (i > 0 && /[A-Za-z]'|[!?.]$/.test(texto) && cena.alvos.indexOf(texto) >= 0)) return 'alvo';
    return i === 0 ? '' : 'pt';
  }
  A.cenas.forEach(function (c) {
    em(c.ini, function () {
      var base = { wave: 'neutral', celebrate: 'neutral', happy: 'neutral', confused: 'neutral', surprise: 'neutral' }[c.eco];
      if (base) { eco.estado('neutral'); eco.estado(c.eco); } else eco.estado(c.eco || 'neutral');
      tela.innerHTML = ''; var n = c.tela.length, dur = Math.max(1, c.fim - c.ini - 0.6);
      c.tela.forEach(function (t, i) {
        var d = document.createElement('div'); d.className = 'linha ' + tipo(t, i, c); d.textContent = t; tela.appendChild(d);
        setTimeout(function () { d.classList.add('on'); }, 150 + i * Math.min(1400, dur * 1000 / (n + 1)));
      });
    });
    c.falas.forEach(function (f) {
      em(f.ini, function () {
        leg.className = 'legenda on' + (f.alvo ? ' alvo' : ''); document.getElementById('quem').textContent = f.alvo ? f.voz : 'Eco';
        document.getElementById('fala').textContent = f.texto; eco.simularVoz(!f.alvo);
      });
      em(f.fim, function () { eco.simularVoz(false); });
    });
    if (c.pausa) { em(c.pausa[0], function () { document.getElementById('pausa').className = 'pausa on'; leg.className = 'legenda'; }); em(c.pausa[1], function () { document.getElementById('pausa').className = 'pausa'; }); }
  });
  em(A.duracao, function () { window.__fim = true; });
};
</script>
</body></html>

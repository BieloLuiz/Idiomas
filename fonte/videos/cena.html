<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
:root{--fundo:#F6F4EF;--papel:#FFFFFF;--tinta:#1F2937;--suave:#5B677D;--linha:#E4E1D8;--marca:#5366C7;--marca-escura:#3C4BA0;--marca-suave:#E8EBFB;--ouro:#E9A93B;--ouro-suave:#FCF0D8;--erro:#B84651;--erro-suave:#F8E3E5;--certo:#2F8F5B;--certo-suave:#E1F3E8}
*{box-sizing:border-box}html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:var(--fundo);font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--tinta)}
body::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#DCD8CC 1.4px,transparent 1.4px);background-size:28px 28px;opacity:.55}
/* progresso e cabeçalho */
.prog{position:absolute;top:30px;left:40px;right:40px;display:flex;gap:8px}
.prog i{flex:1;height:8px;border-radius:9px;background:var(--linha);overflow:hidden}
.prog i b{display:block;height:100%;width:0;background:var(--marca);border-radius:9px}
.topo{position:absolute;top:62px;left:40px;right:40px;display:flex;align-items:center;gap:14px}
.selo{background:var(--tinta);color:#fff;font-weight:800;font-size:20px;letter-spacing:.06em;padding:8px 14px;border-radius:12px;white-space:nowrap}
.titulo{font-size:23px;font-weight:700;color:var(--suave);line-height:1.2}
.parte{position:absolute;top:132px;left:40px;font-size:20px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--marca);display:flex;align-items:center;gap:10px;transition:opacity .3s}
.parte::before{content:"";width:26px;height:4px;border-radius:4px;background:currentColor}
.parte.erro{color:var(--erro)}.parte.desafio{color:var(--ouro)}.parte.fechamento{color:var(--certo)}
/* palco */
.palco{position:absolute;top:180px;left:40px;right:40px;height:680px;display:flex;flex-direction:column;justify-content:center;gap:22px;transition:opacity .4s,filter .4s}
.palco.fundo{opacity:.32;filter:saturate(.5)}
.entra{opacity:0;transform:translateY(26px) scale(.98);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.entra.on{opacity:1;transform:none}
.manchete{font-size:50px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.nota{font-size:32px;font-weight:600;color:var(--suave);line-height:1.3}
.cartao{background:var(--papel);border-radius:30px;padding:30px 34px;box-shadow:0 2px 0 var(--linha),0 18px 40px rgba(31,41,55,.07);position:relative;transition:box-shadow .3s,transform .3s}
.cartao .alvo{font-size:52px;font-weight:800;color:var(--tinta);line-height:1.12;letter-spacing:-.015em}
.cartao .alvo.longo{font-size:44px}
.cartao .trad{font-size:28px;font-weight:600;color:var(--suave);margin-top:10px}
.cartao .trad::before{content:"→ ";color:#A6ADBB}
.cartao.falando{box-shadow:0 0 0 4px var(--marca),0 18px 40px rgba(83,102,199,.22);transform:scale(1.02)}
.alvo w{transition:color .15s}
.cartao.falando .alvo w.dito{color:var(--marca)}
mark{background:linear-gradient(transparent 62%,var(--ouro-suave) 62%);color:inherit;padding:0 2px;border-bottom:4px solid var(--ouro);border-radius:2px}
.quem{position:absolute;top:-18px;left:28px;display:flex;align-items:center;gap:8px;background:var(--tinta);color:#fff;font-size:18px;font-weight:800;padding:6px 14px 6px 6px;border-radius:999px;opacity:0;transform:translateY(6px);transition:.3s}
.cartao.falando .quem{opacity:1;transform:none}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff}
/* equação */
.eq{display:flex;align-items:center;flex-wrap:wrap;gap:16px}
.chip{background:var(--papel);border:3px solid var(--marca);color:var(--marca-escura);font-size:48px;font-weight:800;padding:16px 26px;border-radius:22px;box-shadow:0 10px 24px rgba(83,102,199,.12)}
.chip.b{border-color:var(--linha);color:var(--tinta)}
.igual{font-size:52px;font-weight:800;color:var(--ouro)}
/* erro */
.cartao.ruim{background:var(--erro-suave);box-shadow:none;border:3px solid #EBC2C7}
.cartao.ruim .alvo{color:var(--erro);position:relative;display:inline-block}
.cartao.ruim .alvo::after{content:"";position:absolute;left:-6px;right:-6px;top:52%;height:6px;border-radius:6px;background:var(--erro);transform:scaleX(0);transform-origin:left;transition:transform .6s .5s cubic-bezier(.5,0,.2,1)}
.cartao.ruim.on .alvo::after{transform:scaleX(1)}
.cartao.bom{background:var(--certo-suave);box-shadow:none;border:3px solid #B9E0C8}
.cartao.bom .alvo{color:var(--certo)}
.marcador{position:absolute;right:26px;top:50%;margin-top:-30px;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:900;color:#fff}
.ruim .marcador{background:var(--erro)}.bom .marcador{background:var(--certo)}
/* desafio */
.pergunta{background:var(--tinta);color:#fff;border-radius:32px;padding:36px 38px}
.pergunta .k{font-size:20px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ouro)}
.pergunta .q{font-size:44px;font-weight:800;line-height:1.15;margin-top:10px}
.relogio{align-self:center;width:170px;height:170px;position:relative;opacity:0;transition:opacity .3s}
.relogio.on{opacity:1}
.relogio svg{position:absolute;inset:0;transform:rotate(-90deg)}
.relogio span{position:absolute;inset:0;display:grid;place-items:center;font-size:72px;font-weight:800;color:var(--tinta)}
/* resumo */
.resumo{display:flex;flex-direction:column;gap:14px}
.item{display:flex;align-items:center;gap:18px;background:var(--papel);border-radius:22px;padding:20px 24px;font-size:36px;font-weight:800;box-shadow:0 2px 0 var(--linha)}
.item .ok{width:44px;height:44px;flex:none;border-radius:50%;background:var(--certo);color:#fff;display:grid;place-items:center;font-size:26px}
/* faíscas discretas */
.faisca{position:absolute;width:14px;height:14px;border-radius:4px;pointer-events:none;animation:voa 1.3s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes voa{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--x),var(--y)) rotate(200deg);opacity:0}}
/* legenda */
.legenda{position:absolute;left:40px;right:210px;bottom:64px;background:var(--papel);border-radius:28px;padding:22px 28px 24px;box-shadow:0 18px 40px rgba(31,41,55,.09);opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s}
.legenda.on{opacity:1;transform:none}
.legenda small{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--marca);margin-bottom:8px}
.legenda p{margin:0;font-size:34px;line-height:1.36;font-weight:700}
.legenda p w{color:#C3C8D2;transition:color .12s}.legenda p w.dito{color:var(--tinta)}
.legenda.alvo p{font-weight:800;font-size:36px}.legenda.alvo p w.dito{color:var(--marca)}
.eco{position:absolute;right:22px;bottom:70px;width:180px}
.marca{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:18px;font-weight:700;color:#A0A8B8;letter-spacing:.04em}
</style></head><body>
<div class="prog" id="prog"></div>
<div class="topo"><span class="selo" id="selo"></span><span class="titulo" id="titulo"></span></div>
<div class="parte" id="parte"></div>
<div class="palco" id="palco"></div>
<div class="legenda" id="legenda"><small id="quem"></small><p id="fala"></p></div>
<div class="eco" id="eco"></div>
<div class="marca">idiomas · seu tempo, seu ritmo</div>
<script>
/* tocarAula(A): A = { titulo, idioma, nivel, cenas:[{ini, fim, parte, eco, tela:[...], alvos:[...], falas:[{ini,fim,voz,texto,alvo}], pausa:[ini,fim]}], duracao } — toca em tempo real */
var CORES = { sarah: '#C2577A', lucas: '#2F8F8A', emma: '#8A5CC2', daniel: '#B9772F', claire: '#C2577A', 'inès': '#8A5CC2', ines: '#8A5CC2', antoine: '#B9772F' };
var NOMES_PARTE = { gancho: 'Situação', explicacao: 'Como funciona', erro: 'Erro comum', desafio: 'Sua vez', fechamento: 'Resumo' };
function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
function palavras(s) { return String(s).split(/\s+/).filter(Boolean); }
function emW(s, marcarDe) { return palavras(s).map(function (w, i) { var h = '<w>' + esc(w) + '</w>'; return i === marcarDe ? '<mark>' + h : h; }).join(' ') + (marcarDe >= 0 && marcarDe < palavras(s).length ? '</mark>' : ''); }
function norm(s) { return String(s).toLowerCase().replace(/[.!?¿¡,]/g, '').replace(/\s+/g, ' ').trim(); }

window.tocarAula = function (A) {
  document.getElementById('selo').textContent = (A.idioma === 'fr' ? 'FRANCÊS' : 'INGLÊS') + ' ' + A.nivel;
  document.getElementById('titulo').textContent = A.titulo;
  var prog = document.getElementById('prog'); prog.innerHTML = A.cenas.map(function () { return '<i><b></b></i>'; }).join('');
  var eco = Eco.criar(document.getElementById('eco'), { estilo: '2.5d', justo: true, estado: 'neutral', semToque: true });
  var palco = document.getElementById('palco'), leg = document.getElementById('legenda'), parteEl = document.getElementById('parte'), t0 = performance.now();
  var alvosAula = []; A.cenas.forEach(function (c) { c.falas.forEach(function (f) { if (f.alvo && alvosAula.indexOf(f.texto) < 0) alvosAula.push(f.texto); }); });
  function em(s, fn) { setTimeout(fn, Math.max(0, s * 1000 - (performance.now() - t0))); }
  function ehAlvo(t, c) { var n = norm(t); return c.alvos.some(function (a) { return norm(a) === n || n.indexOf(norm(a)) >= 0 && n.length - norm(a).length < 4; }) || alvosAula.some(function (a) { return norm(a) === n; }); }

  function montar(c) {
    var itens = [], tela = c.tela.slice(), pausa = !!c.pausa;
    /* palavra em que as frases-alvo da cena começam a diferir (o que muda) */
    var alvosTela = tela.filter(function (t) { return ehAlvo(t, c); }), corte = -1;
    if (alvosTela.length > 1) { var ps = alvosTela.map(palavras); corte = 0; while (ps.every(function (p) { return p[corte] && norm(p[corte]) === norm(ps[0][corte]); })) corte++; if (corte === 0 || ps.some(function (p) { return corte >= p.length; })) corte = -1; }
    if (c.parte === 'fechamento') {
      var cab = document.createElement('div'); cab.className = 'manchete entra'; cab.textContent = 'Você aprendeu'; itens.push(cab);
      var r = document.createElement('div'); r.className = 'resumo';
      alvosAula.slice(0, 4).forEach(function (a) { var it = document.createElement('div'); it.className = 'item entra'; it.innerHTML = '<span class="ok">✓</span>' + esc(a); r.appendChild(it); itens.push(it); });
      palco.appendChild(cab); palco.appendChild(r);
      tela.forEach(function (t) { var d = document.createElement('div'); d.className = 'nota entra'; d.textContent = t; palco.appendChild(d); itens.push(d); });
      return itens;
    }
    if (pausa) {
      var p = document.createElement('div'); p.className = 'pergunta entra';
      var q = tela.filter(function (t) { return /\?$/.test(t) || /:/.test(t); })[0] || tela[1] || tela[0];
      p.innerHTML = '<div class="k">' + esc(tela[0]) + '</div><div class="q">' + esc(q) + '</div>';
      palco.appendChild(p); itens.push(p);
      tela.slice(1).filter(function (t) { return t !== q; }).forEach(function (t) { var d = document.createElement('div'); d.className = 'nota entra'; d.style.textAlign = 'center'; d.textContent = t; palco.appendChild(d); itens.push(d); });
      var rel = document.createElement('div'); rel.className = 'relogio'; rel.id = 'relogio';
      rel.innerHTML = '<svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="74" fill="#fff" stroke="#E4E1D8" stroke-width="12"/><circle id="arco" cx="85" cy="85" r="74" fill="none" stroke="#E9A93B" stroke-width="12" stroke-linecap="round" stroke-dasharray="465" stroke-dashoffset="0"/></svg><span id="seg"></span>';
      palco.appendChild(rel);
      return itens;
    }
    var i = 0;
    while (i < tela.length) {
      var t = tela[i], d;
      if (/^✗/.test(t) || /^✓/.test(t)) {
        var bom = /^✓/.test(t); d = document.createElement('div'); d.className = 'cartao entra ' + (bom ? 'bom' : 'ruim');
        d.innerHTML = '<div class="alvo' + (t.length > 24 ? ' longo' : '') + '">' + emW(t.replace(/^[✗✓]\s*/, ''), -1) + '</div><span class="marcador">' + (bom ? '✓' : '✗') + '</span>';
        d.dataset.texto = t.replace(/^[✗✓]\s*/, ''); i++;
      } else if (/\s=\s/.test(t)) {
        var lados = t.split(/\s=\s/); d = document.createElement('div'); d.className = 'eq entra';
        d.innerHTML = '<span class="chip">' + esc(lados[0]) + '</span><span class="igual">=</span><span class="chip b">' + esc(lados[1]) + '</span>'; i++;
      } else if (ehAlvo(t, c)) {
        d = document.createElement('div'); d.className = 'cartao entra'; d.dataset.texto = t;
        var trad = tela[i + 1] && !ehAlvo(tela[i + 1], c) && !/[=✗✓]/.test(tela[i + 1]) && !/!$/.test(tela[i + 1]) ? tela[i + 1] : null;
        if (trad && i + 1 === tela.length - 1 && /\?$/.test(trad)) trad = null;
        d.innerHTML = '<span class="quem"></span><div class="alvo' + (t.length > 24 ? ' longo' : '') + '">' + emW(t, corte) + '</div>' + (trad ? '<div class="trad">' + esc(trad) + '</div>' : '');
        i += trad ? 2 : 1;
      } else {
        d = document.createElement('div'); d.className = itens.length === 0 ? 'manchete entra' : 'nota entra'; d.textContent = t; i++;
      }
      palco.appendChild(d); itens.push(d);
    }
    return itens;
  }

  function faiscas() {
    var cores = ['#5366C7', '#E9A93B', '#2F8F5B', '#C2577A'];
    for (var k = 0; k < 22; k++) { var f = document.createElement('div'); f.className = 'faisca'; var ang = Math.random() * Math.PI * 2, r = 180 + Math.random() * 220;
      f.style.cssText = 'left:360px;top:520px;background:' + cores[k % 4] + ';--x:' + Math.cos(ang) * r + 'px;--y:' + Math.sin(ang) * r + 'px;animation-delay:' + (Math.random() * .2) + 's';
      document.body.appendChild(f); }
  }

  function frases(t) { return String(t).split(/(?<=[.!?])\s+/).filter(Boolean); }
  function legendar(f) {
    var dur = Math.max(.5, f.fim - f.ini), cor = CORES[String(f.voz).toLowerCase()] || '#5366C7';
    if (f.alvo) {
      /* fala no idioma: a legenda some, o foco é o cartão */
      leg.className = 'legenda'; palco.classList.remove('fundo');
      var card = null, ws = palavras(f.texto), tot = f.texto.length, acc = 0;
      palco.querySelectorAll('[data-texto]').forEach(function (cdt) { var a = norm(cdt.dataset.texto), b = norm(f.texto); if (!card && (a.indexOf(b) >= 0 || b.indexOf(a) >= 0)) card = cdt; });
      if (!card) { leg.className = 'legenda on alvo'; document.getElementById('quem').innerHTML = '<span class="av" style="background:' + cor + '">' + esc(String(f.voz)[0]) + '</span>' + esc(f.voz); document.getElementById('fala').innerHTML = esc(f.texto); return; }
      var cws = card.querySelectorAll('.alvo w'); card.classList.add('falando');
      var q = card.querySelector('.quem'); if (q) q.innerHTML = '<span class="av" style="background:' + cor + '">' + esc(String(f.voz)[0]) + '</span>' + esc(f.voz);
      ws.forEach(function (w, i) { var t = f.ini + dur * (acc / tot) * .92; acc += w.length + 1; em(t, function () { if (cws[i]) cws[i].classList.add('dito'); }); });
      em(f.fim, function () { card.classList.remove('falando'); cws.forEach(function (x) { x.classList.remove('dito'); }); });
      return;
    }
    /* narração: uma frase por vez, palco ao fundo */
    palco.classList.add('fundo'); document.getElementById('quem').textContent = 'Eco explica'; leg.className = 'legenda on';
    var fs = frases(f.texto), total = f.texto.length, ini = f.ini;
    fs.forEach(function (fr) {
      var d = dur * (fr.length + 1) / (total + 1), comeco = ini; ini += d;
      em(comeco, function () {
        var ws = palavras(fr), p = document.getElementById('fala'); p.innerHTML = ws.map(function (w) { return '<w>' + esc(w) + '</w>'; }).join(' ');
        var sp = p.querySelectorAll('w'), acc = 0; ws.forEach(function (w, i) { var t = comeco + d * (acc / fr.length) * .9; acc += w.length + 1; em(t, function () { sp[i].classList.add('dito'); }); });
      });
    });
    em(f.fim, function () { palco.classList.remove('fundo'); });
  }

  A.cenas.forEach(function (c, ci) {
    em(c.ini, function () {
      var bar = prog.children[ci].firstChild; bar.style.transition = 'width ' + (c.fim - c.ini) + 's linear'; bar.style.width = '100%';
      eco.estado('neutral'); eco.estado(c.eco || 'neutral');
      var nome = NOMES_PARTE[c.parte] || ''; if (c.parte === 'desafio' && !c.pausa) nome = 'Resposta';
      parteEl.className = 'parte ' + (c.parte || ''); parteEl.textContent = nome;
      palco.innerHTML = '';
      var itens = montar(c), n = itens.length;
      var janela = Math.max(1.2, (c.falas[0] ? c.falas[0].fim - c.ini : 2));
      itens.forEach(function (d, i) { em(c.ini + .15 + i * Math.min(1.6, janela / (n + .5)), function () { d.classList.add('on'); }); });
      if (c.eco === 'celebrate') em(c.ini + .4, faiscas);
    });
    c.falas.forEach(function (f) {
      em(f.ini, function () { legendar(f); eco.simularVoz(!f.alvo); });
      em(f.fim, function () { eco.simularVoz(false); });
    });
    if (c.pausa) {
      em(c.pausa[0], function () {
        leg.className = 'legenda'; palco.classList.remove('fundo'); var rel = document.getElementById('relogio'); if (!rel) return; rel.classList.add('on');
        var tot = c.pausa[1] - c.pausa[0], arco = document.getElementById('arco');
        arco.style.transition = 'stroke-dashoffset ' + tot + 's linear'; requestAnimationFrame(function () { arco.style.strokeDashoffset = '465'; });
        for (var s = 0; s < Math.ceil(tot); s++) (function (s) { em(c.pausa[0] + s, function () { document.getElementById('seg').textContent = Math.ceil(tot) - s; }); })(s);
      });
    }
  });
  em(A.duracao, function () { window.__fim = true; });
};
</script>
</body></html>
